[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrav"
version = "0.1.0"
description = "Audit-first minimal gravity simulator research kernel"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26,<2.0",
  "pandas>=2.2",
  "poliastro>=0.17",
  "pytest>=8.3",
  "rebound>=4.4",
  "scipy>=1.14",
  "seaborn>=0.13"
]

[project.optional-dependencies]
calibration = [
  "torch>=2.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
